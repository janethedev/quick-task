name: Release

# 当推送以 v 开头的标签时触发（例如 v1.1.1）
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write # 允许创建 Release 和上传文件
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装前端依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建 Tauri 应用并发布
      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # 使用推送的标签名（如 v1.1.1）
          releaseName: 'QuickTask ${{ github.ref_name }}'
          releaseBody: |
            ## 下载安装包
            
            请在下方 Assets 中下载对应的安装包：
            - Windows 64位：`QuickTask_${{ github.ref_name }}_x64-setup.exe`
            
            ## 更新内容
            请查看提交记录了解详细更改。
          releaseDraft: false # false 为自动发布，true 为保存为草稿
          prerelease: false # 是否为预发布版本

